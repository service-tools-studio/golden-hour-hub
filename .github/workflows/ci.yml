# Quality gate before merge / production deploy (Vercel listens to main).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      # Satisfy instrumentation assertProductionAuthConfig; not used at runtime in this job.
      AUTH_SESSION_SECRET: ci-build-auth-secret-32-characters-min
      COGNITO_USER_POOL_ID: us-west-2_CiBuildOnly
      COGNITO_CLIENT_ID: ci-build-cognito-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [unit]
    permissions:
      id-token: write
      contents: read
    env:
      CI: true
      AWS_REGION: us-west-2
      E2E_DYNAMODB_TABLE_NAME: GoldenHourHub-e2e
      DYNAMODB_TABLE_NAME: GoldenHourHub-e2e
      SMS_PROVIDER: mock
      AUTH_SESSION_SECRET: ${{ secrets.E2E_AUTH_SESSION_SECRET || 'e2e-ci-auth-secret-32-characters-min' }}
    steps:
      - uses: actions/checkout@v4
      - name: OIDC preflight (match IAM trust policy)
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ROLE_ARN:-}" ]; then
            echo "::error::GitHub secret AWS_ROLE_ARN is missing or empty on this run."
            echo "Add it under Settings → Secrets and variables → Actions (not available on fork PRs)."
            exit 1
          fi
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "Expected sub (push to main): repo:${GITHUB_REPOSITORY}:ref:refs/heads/main"
          echo "Expected sub (pull_request): repo:${GITHUB_REPOSITORY}:pull_request"
          TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')"
          PAYLOAD="$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          PAD="$(( (4 - ${#PAYLOAD} % 4) % 4 ))"
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 "$PAD"))"
          echo "OIDC claims (use sub + aud in IAM trust):"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub,aud,repository,ref,event_name}'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          audience: sts.amazonaws.com
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
