# Quality gate before merge / production deploy (Vercel listens to main).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      # Satisfy instrumentation assertProductionAuthConfig; not used at runtime in this job.
      AUTH_SESSION_SECRET: ci-build-auth-secret-32-characters-min
      COGNITO_USER_POOL_ID: us-west-2_CiBuildOnly
      COGNITO_CLIENT_ID: ci-build-cognito-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [unit]
    permissions:
      id-token: write
      contents: read
    env:
      CI: true
      AWS_REGION: us-west-2
      E2E_DYNAMODB_TABLE_NAME: GoldenHourHub-e2e
      DYNAMODB_TABLE_NAME: GoldenHourHub-e2e
      SMS_PROVIDER: mock
      AUTH_SESSION_SECRET: ${{ secrets.E2E_AUTH_SESSION_SECRET || 'e2e-ci-auth-secret-32-characters-min' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          audience: sts.amazonaws.com
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
